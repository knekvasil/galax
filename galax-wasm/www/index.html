<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>galax — n-body simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="controls" class="control-bar">
        <div class="control-group">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <circle cx="4" cy="12" r="1.5"/>
                <circle cx="20" cy="12" r="1.5"/>
                <circle cx="12" cy="4" r="1.5"/>
                <circle cx="12" cy="20" r="1.5"/>
            </svg>
            <select id="preset">
                <option value="uniform">Uniform</option>
                <option value="plummer">Plummer</option>
                <option value="disk">Disk</option>
                <option value="galaxy">Galaxy</option>
            </select>
        </div>

        <div class="divider"></div>

        <div class="control-group">
            <label for="body-count">Bodies</label>
            <input type="range" id="body-count" min="10" max="262144" step="10" value="10000">
            <span id="body-count-value" class="value-label">10,000</span>
        </div>

        <div class="divider"></div>

        <div class="control-group">
            <button id="pause-btn" class="icon-btn" title="Pause / Resume">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1"/>
                    <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
            </button>
        </div>
    </div>

    <script type="module">
        try {
            const module = await import('./galax_wasm.js');
            const { create_sim_state, default: init } = module;
            await init();

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const presetEl = document.getElementById('preset');
            const bodyCountEl = document.getElementById('body-count');
            const bodyCountValue = document.getElementById('body-count-value');
            const pauseBtn = document.getElementById('pause-btn');

            let sim = await create_sim_state(10000, 'uniform');
            let paused = false;
            let lastTime = performance.now();
            let simStart = performance.now();
            let stepsPerSec = 0;
            let stepAccum = 0;
            let fpsTimer = 0;

            async function renderFrame(time) {
                const elapsed = time - lastTime;
                lastTime = time;

                const steps = Math.max(1, Math.ceil(100 * elapsed / 1000));
                const stepsToRun = Math.min(steps, 5);

                if (!paused) {
                    for (let i = 0; i < stepsToRun; i++) {
                        await sim.step();
                    }
                    stepAccum += stepsToRun;
                }

                fpsTimer += elapsed;
                if (fpsTimer > 500) {
                    stepsPerSec = stepAccum / (fpsTimer / 1000);
                    stepAccum = 0;
                    fpsTimer = 0;
                }

                sim.render(ctx, canvas.width, canvas.height, time - simStart, stepsPerSec);
                requestAnimationFrame(renderFrame);
            }

            bodyCountEl.addEventListener('input', () => {
                bodyCountValue.textContent = parseInt(bodyCountEl.value).toLocaleString();
            });

            bodyCountEl.addEventListener('change', async () => {
                const n = parseInt(bodyCountEl.value);
                const preset = presetEl.value;
                sim = await create_sim_state(n, preset);
                simStart = performance.now();
                stepAccum = 0;
                fpsTimer = 0;
            });

            presetEl.addEventListener('change', async () => {
                const n = parseInt(bodyCountEl.value);
                const preset = presetEl.value;
                sim = await create_sim_state(n, preset);
                simStart = performance.now();
                stepAccum = 0;
                fpsTimer = 0;
            });

            pauseBtn.addEventListener('click', () => {
                paused = !paused;
                pauseBtn.innerHTML = paused
                    ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
                pauseBtn.title = paused ? 'Resume' : 'Pause';
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                sim.camera_zoom(factor, mx, my, canvas.width, canvas.height);
            });

            let dragging = false;
            let dragX = 0, dragY = 0;

            canvas.addEventListener('pointerdown', (e) => {
                dragging = true;
                dragX = e.clientX;
                dragY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - dragX;
                const dy = e.clientY - dragY;
                sim.camera_pan(dx, dy, canvas.width, canvas.height);
                dragX = e.clientX;
                dragY = e.clientY;
            });

            canvas.addEventListener('pointerup', () => {
                dragging = false;
            });

            requestAnimationFrame(renderFrame);
        } catch (e) {
            console.error('[galax] init failed:', e);
            const msg = (e && e.message) ? e.message : String(e);
            const isFirefox = navigator.userAgent.includes('Firefox');
            const isWebGpuMissing = msg.includes('no adapter') || msg.includes('WebGPU');
            const fb = document.createElement('div');
            fb.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:24px;background:#1a1a2e;color:#e0e0e0;text-align:center;z-index:100;font-family:sans-serif;font-size:15px;line-height:1.5';
            if (isFirefox) {
                fb.innerHTML = `
                    <div style="max-width:500px;margin:0 auto">
                        <strong style="font-size:18px">⚠️ WebGPU not available</strong>
                        <p style="margin:8px 0 0;color:#aaa">galax uses WebGPU for GPU-accelerated simulation.
                        Firefox's WebGPU support is still experimental on this platform.</p>
                        <p style="margin:12px 0 0;color:#888;font-size:13px">Try Chrome 113+ or Edge 113+ for the full experience.</p>
                    </div>
                `;
            } else {
                fb.textContent = 'Failed to initialize: ' + msg;
                fb.style.background = '#5a1a1a';
                fb.style.color = '#ffaaaa';
            }
            document.body.prepend(fb);
        }
    </script>
</body>
</html>
